<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Azerta</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1628">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="animations.css">
</head>
<body>

<div id="snow-layer" aria-hidden="true"></div>

<!-- ═══ ЗАСТАВКА ═══ -->
<div id="splash-screen">
  <div id="splash-logo"><div class="auth-logo-inner" style="font-size:60px;">🎄</div></div>
  <div id="splash-title">AZERTA</div>
  <div id="splash-subtitle">❄ семейный мессенджер ❄</div>
  <div id="splash-loader"></div>
</div>

<!-- ═══ ЭКРАН ВХОДА ═══ -->
<div id="auth">
  <div class="auth-bg">
    <div class="auth-blob auth-blob-1"></div>
    <div class="auth-blob auth-blob-2"></div>
  </div>

  <div id="auth-login-screen" class="auth-screen active">
    <div class="auth-card">
      <div class="auth-logo"><div class="auth-logo-inner">🎄</div></div>
      <h1 class="auth-title">Azerta</h1>
      <p class="auth-subtitle">❄ Твой семейный мессенджер ❄</p>

      <div class="auth-input-group">
        <input id="login-username" class="auth-input" placeholder=" " autocapitalize="none" autocomplete="username">
        <label class="auth-label" for="login-username">Ник</label>
        <span class="auth-input-icon">👤</span>
      </div>

      <div class="auth-input-group">
        <input id="login-password" class="auth-input" type="password" placeholder=" " autocomplete="current-password">
        <label class="auth-label" for="login-password">Пароль</label>
        <span class="auth-input-icon">🔒</span>
        <button type="button" class="auth-toggle-password" data-action="toggle-password" data-target="login-password">👁</button>
      </div>

      <div class="auth-err" id="login-error"></div>

      <button type="button" class="auth-btn-primary" id="login-btn" data-action="login">
        <span class="btn-text">🎅 Войти</span>
      </button>

      <!-- Кнопка регистрации (пока отключена, чтобы не было путаницы) -->
      <button type="button" class="auth-btn-link" data-action="switch-auth" data-mode="register">
        Нет аккаунта? <span>Зарегистрироваться</span>
      </button>
    </div>
  </div>

  <div id="auth-register-screen" class="auth-screen">
    <div class="auth-card">
      <h1 class="auth-title">Регистрация</h1>
      <p class="auth-subtitle" style="text-align:center;color:var(--text-muted);margin-bottom:20px;">В разработке</p>
      <button type="button" class="auth-btn-link" data-action="switch-auth" data-mode="login">‹ Назад</button>
    </div>
  </div>
</div>

<!-- ═══ ОСНОВНОЕ ПРИЛОЖЕНИЕ ═══ -->
<div id="app" data-tab="chats">
  <div id="conn-status"><span class="dot"></span><span class="text" id="conn-text">Azerta: я с тобой ✨</span></div>

  <div id="main-header">
    <button type="button" id="burger" data-action="open-settings">☰</button>
    <h2>Azerta</h2>
    <button type="button" class="icon-btn" id="my-avatar-btn" data-action="open-settings"></button>
  </div>
  
  <div class="garland" aria-hidden="true"></div>

  <div id="search-wrap"><input id="search" placeholder="🔍 Поиск"></div>
  
  <!-- СПИСОК ЧАТОВ -->
  <div id="chat-list"></div>

  <!-- ВКЛАДКИ -->
  <div id="tab-calls" class="app-tab">
    <div class="tab-empty"><div class="big">📞</div><div>История звонков</div></div>
  </div>
  <div id="tab-contacts" class="app-tab">
    <div class="tab-empty"><div class="big">👥</div><div>Контакты</div></div>
  </div>
  <div id="tab-settings" class="app-tab"><div id="tab-settings-content"></div></div>

  <!-- НИЖНЕЕ МЕНЮ -->
  <div id="bottom-nav">
    <button type="button" class="nav-btn active" data-tab="chats" data-action="tab" data-value="chats">
      <span class="nav-icon">💬</span><span class="nav-label">Чаты</span>
    </button>
    <button type="button" class="nav-btn" data-tab="calls" data-action="tab" data-value="calls">
      <span class="nav-icon">📞</span><span class="nav-label">Звонки</span>
    </button>
    <button type="button" class="nav-btn" data-tab="contacts" data-action="tab" data-value="contacts">
      <span class="nav-icon">👥</span><span class="nav-label">Контакты</span>
    </button>
    <button type="button" class="nav-btn" data-tab="settings" data-action="tab" data-value="settings">
      <span class="nav-icon">🎄</span><span class="nav-label">Настройки</span>
    </button>
  </div>
</div>

<!-- ═══ ЭКРАН НАСТРОЕК ═══ -->
<div id="settings-screen">
  <div id="settings-header">
    <button type="button" class="back-btn" data-action="close-settings">‹</button>
    <h2>🎄 Настройки</h2>
  </div>
  <div id="settings-content"></div>
</div>

<!-- ═══ ЭКРАН ЧАТА ═══ -->
<div id="chat-screen">
  <div id="chat-top">
    <button type="button" class="back-btn" data-action="close-chat">‹</button>
    <div class="avatar" id="chat-avatar"></div>
    <div id="chat-top-info">
      <div id="chat-top-name">—</div>
      <div id="chat-top-status">—</div>
    </div>
    <div id="chat-actions">
      <button type="button" data-action="call-audio">📞</button>
      <button type="button" data-action="call-video">📹</button>
    </div>
  </div>

  <div id="messages"></div>

  <div id="reply-preview">
    <div class="rp-text">
      <div class="rp-name" id="rp-name">—</div>
      <div class="rp-msg" id="rp-msg">—</div>
    </div>
    <button type="button" class="rp-close" data-action="cancel-reply">✕</button>
  </div>

  <div id="input-area">
    <input id="msgInput" placeholder="Сообщение...">
    <button type="button" id="send-btn" data-action="send-msg">➤</button>
  </div>
</div>

<!-- ═══ ЭКРАН ЗВОНКА ═══ -->
<div id="call-screen">
  <div id="remote-video-wrap">
    <video id="remoteVideo" autoplay playsinline></video>
  </div>
  <div id="call-info">
    <div id="call-peer-name">—</div>
    <div id="call-status">Соединение...</div>
    <div id="call-timer"></div>
  </div>
  <div id="local-video-wrap"><video id="localVideo" autoplay muted playsinline></video></div>
  <div id="call-controls-bar">
    <button type="button" class="call-btn" id="micBtn" data-action="toggle-mic">🎤</button>
    <button type="button" class="call-btn" id="camBtn" data-action="toggle-camera">📷</button>
    <button type="button" class="call-btn hangup" data-action="hangup">📵</button>
  </div>
</div>

<!-- ═══ ВХОДЯЩИЙ ЗВОНОК ═══ -->
<div id="incoming-screen">
  <div>
    <div class="from-label">🎅 Входящий звонок</div>
    <div class="from-name" id="incoming-name">—</div>
    <div class="type" id="incoming-type">Видеозвонок</div>
  </div>
  <div class="buttons">
    <button type="button" class="incoming-btn decline" data-action="decline-call">📵</button>
    <button type="button" class="incoming-btn accept" data-action="accept-call">📞</button>
  </div>
</div>

<!-- ═══ ПРОЧИЕ МОДАЛКИ (Упрощенные) ═══ -->
<div class="modal" id="profile-modal"><div class="modal-box">
  <h3>Профиль</h3>
  <div id="profile-username" style="text-align:center;color:var(--text-muted);margin-bottom:16px;"></div>
  <button type="button" class="modal-secondary" data-action="close-modal" data-target="profile-modal">Закрыть</button>
</div></div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
