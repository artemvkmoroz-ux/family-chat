<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Azerta</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="animations.css">
</head>
<body>

<div id="splash-screen" style="position:fixed;inset:0;background:#0a1628;display:flex;align-items:center;justify-content:center;z-index:9999;">
  <div style="text-align:center;">
    <div style="font-size:60px;margin-bottom:20px;">🎄</div>
    <div style="font-size:24px;font-weight:800;color:#fff;letter-spacing:4px;">AZERTA</div>
  </div>
</div>

<!-- ЭКРАН ВХОДА -->
<div id="auth" style="display:none;position:fixed;inset:0;background:#0a1628;z-index:1000;padding:20px;">
  <div class="auth-card" style="max-width:400px;margin:100px auto;background:#142642;padding:30px;border-radius:20px;">
    <h1 style="text-align:center;margin-bottom:30px;color:#fff;">Вход</h1>
    
    <input id="login-username" placeholder="Ник" style="width:100%;padding:15px;margin-bottom:15px;background:rgba(255,255,255,0.1);border:none;border-radius:10px;color:#fff;font-size:16px;">
    
    <input id="login-password" type="password" placeholder="Пароль" style="width:100%;padding:15px;margin-bottom:15px;background:rgba(255,255,255,0.1);border:none;border-radius:10px;color:#fff;font-size:16px;">
    
    <button onclick="doLogin()" style="width:100%;padding:15px;background:#e63946;border:none;border-radius:10px;color:#fff;font-size:16px;font-weight:700;cursor:pointer;">Войти</button>
  </div>
</div>

<!-- ПРИЛОЖЕНИЕ -->
<div id="app" style="display:none;position:fixed;inset:0;background:#0a1628;flex-direction:column;">
  <div style="padding:20px;background:#0f1e35;border-bottom:1px solid rgba(255,255,255,0.1);">
    <h2 style="color:#fff;margin:0;">Azerta</h2>
  </div>
  <div id="chat-list" style="flex:1;overflow-y:auto;padding:10px;"></div>
</div>

<!-- ЭКРАН ЧАТА -->
<div id="chat-screen" style="display:none;position:fixed;inset:0;background:#0a1628;z-index:500;flex-direction:column;">
  <div style="padding:15px;background:#0f1e35;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,0.1);">
    <button onclick="closeChat()" style="background:none;border:none;color:#e63946;font-size:28px;cursor:pointer;">‹</button>
    <div id="chat-top-name" style="color:#fff;font-weight:700;font-size:18px;">—</div>
  </div>
  <div id="messages" style="flex:1;overflow-y:auto;padding:15px;"></div>
  <div style="padding:10px;background:#0f1e35;display:flex;gap:10px;">
    <input id="msgInput" placeholder="Сообщение..." style="flex:1;padding:12px;background:rgba(255,255,255,0.1);border:none;border-radius:20px;color:#fff;font-size:15px;">
    <button onclick="sendMsg()" style="width:50px;height:50px;background:#e63946;border:none;border-radius:50%;color:#fff;font-size:18px;cursor:pointer;">➤</button>
  </div>
</div>

<style>
  /* Базовые стили, чтобы сообщения выглядели нормально */
  .msg-wrap { display: flex; margin: 5px 0; }
  .msg-wrap.self { justify-content: flex-end; }
  .msg-wrap.other { justify-content: flex-start; }
  .msg { max-width: 70%; padding: 10px 15px; border-radius: 15px; color: #fff; }
  .msg.self { background: #e63946; }
  .msg.other { background: #1a3355; }
  .chat-item { display: flex; gap: 12px; padding: 12px; border-radius: 12px; cursor: pointer; }
  .chat-item:hover { background: rgba(255,255,255,0.05); }
  .avatar { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; color: #fff; flex-shrink: 0; }
  .chat-name { color: #fff; font-weight: 600; font-size: 16px; }
  .chat-preview { color: #888; font-size: 14px; margin-top: 4px; }
  .chat-info { flex: 1; }
  #auth.active { display: block !important; }
  #app.active { display: flex !important; }
  #chat-screen.active { display: flex !important; }
</style>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
