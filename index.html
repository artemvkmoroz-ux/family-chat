<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Azerta</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1628">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="animations.css">
</head>
<body>

<div id="snow-layer" aria-hidden="true"></div>

<!-- ═══ SPLASH ═══ -->
<div id="splash-screen">
  <div id="splash-logo"><div class="auth-logo-inner" style="font-size:60px;">🎄</div></div>
  <div id="splash-title">AZERTA</div>
  <div id="splash-subtitle">❄ семейный мессенджер ❄</div>
  <div id="splash-loader"></div>
</div>

<!-- ═══ AUTH ═══ -->
<div id="auth">
  <div class="auth-bg">
    <div class="auth-blob auth-blob-1"></div>
    <div class="auth-blob auth-blob-2"></div>
  </div>

  <div id="auth-login-screen" class="auth-screen active">
    <div class="auth-card">
      <div class="auth-logo"><div class="auth-logo-inner">🎄</div></div>
      <h1 class="auth-title">Azerta</h1>
      <p class="auth-subtitle">❄ Твой семейный мессенджер ❄</p>
      <div class="auth-input-group">
        <input id="login-username" class="auth-input" placeholder=" " autocapitalize="none">
        <label class="auth-label" for="login-username">Ник</label>
        <span class="auth-input-icon">👤</span>
      </div>
      <div class="auth-input-group">
        <input id="login-password" class="auth-input" type="password" placeholder=" ">
        <label class="auth-label" for="login-password">Пароль</label>
        <span class="auth-input-icon">🔒</span>
        <button type="button" class="auth-toggle-password" onclick="togglePassword('login-password')">👁</button>
      </div>
      <div class="auth-err" id="login-error"></div>
      <button type="button" class="auth-btn-primary" id="login-btn" onclick="doLogin()">
        <span class="btn-text">🎅 Войти</span>
      </button>
    </div>
  </div>
</div>

<!-- ═══ APP ═══ -->
<div id="app" data-tab="chats">
  <div id="main-header">
    <button type="button" id="burger" onclick="openSettings()">☰</button>
    <h2>Azerta</h2>
    <button type="button" class="icon-btn" onclick="openModal('create-menu-modal')">＋</button>
    <button type="button" class="icon-btn" id="my-avatar-btn" onclick="openSettings()"></button>
  </div>

  <div id="search-wrap"><input id="search" placeholder="🔍 Поиск"></div>
  
  <div id="chat-list"></div>

  <div id="tab-calls" class="app-tab"><div class="tab-empty"><div class="big">📞</div><div>Звонки</div></div></div>
  <div id="tab-contacts" class="app-tab"><div class="tab-empty"><div class="big">👥</div><div>Контакты</div></div></div>
  <div id="tab-settings" class="app-tab"><div id="tab-settings-content"></div></div>

  <!-- МЕНЮ -->
  <div id="bottom-nav">
    <button type="button" class="nav-btn active" data-tab="chats" onclick="switchTab('chats')">
      <span class="nav-icon">💬</span><span class="nav-label">Чаты</span>
    </button>
    <button type="button" class="nav-btn" data-tab="calls" onclick="switchTab('calls')">
      <span class="nav-icon">📞</span><span class="nav-label">Звонки</span>
    </button>
    <button type="button" class="nav-btn" data-tab="contacts" onclick="switchTab('contacts')">
      <span class="nav-icon">👥</span><span class="nav-label">Контакты</span>
    </button>
    <button type="button" class="nav-btn" data-tab="settings" onclick="openSettings()">
      <span class="nav-icon">🎄</span><span class="nav-label">Настройки</span>
    </button>
  </div>
</div>

<!-- ═══ SETTINGS SCREEN ═══ -->
<div id="settings-screen">
  <div id="settings-header">
    <button type="button" class="back-btn" onclick="closeSettings()">‹</button>
    <h2>🎄 Настройки</h2>
  </div>
  <div id="settings-content"></div>
</div>

<!-- ═══ CHAT SCREEN ═══ -->
<div id="chat-screen">
  <div id="chat-top">
    <button type="button" class="back-btn" onclick="closeChat()">‹</button>
    <div class="avatar" id="chat-avatar"></div>
    <div id="chat-top-info">
      <div id="chat-top-name">—</div>
      <div id="chat-top-status">—</div>
    </div>
    <div id="chat-actions">
      <button type="button" onclick="startCall(false)">📞</button>
      <button type="button" onclick="startCall(true)">📹</button>
    </div>
  </div>
  <div id="messages"></div>
  <div id="input-area">
    <input id="msgInput" placeholder="Сообщение...">
    <button type="button" id="send-btn" onclick="sendMsg()">➤</button>
  </div>
</div>

<!-- ═══ CALLS ═══ -->
<div id="call-screen">
  <div id="remote-video-wrap"><video id="remoteVideo" autoplay playsinline></video></div>
  <div id="call-info"><div id="call-peer-name">—</div><div id="call-status">Соединение...</div><div id="call-timer"></div></div>
  <div id="local-video-wrap"><video id="localVideo" autoplay muted playsinline></video></div>
  <div id="call-controls-bar">
    <button type="button" class="call-btn" id="micBtn" onclick="toggleMic()">🎤</button>
    <button type="button" class="call-btn" id="camBtn" onclick="toggleCamera()">📷</button>
    <button type="button" class="call-btn hangup" onclick="hangup()">📵</button>
  </div>
</div>

<div id="incoming-screen">
  <div><div class="from-label">🎅 Входящий звонок</div><div class="from-name" id="incoming-name">—</div><div class="type" id="incoming-type">Видеозвонок</div></div>
  <div class="buttons">
    <button type="button" class="incoming-btn decline" onclick="declineIncoming()">📵</button>
    <button type="button" class="incoming-btn accept" onclick="acceptIncoming()">📞</button>
  </div>
</div>

<!-- ═══ MODALS ═══ -->
<div class="modal" id="create-menu-modal"><div class="modal-box">
  <h3>🎄 Что создать?</h3>
  <button type="button" class="create-menu-btn" onclick="closeModal('create-menu-modal'); openModal('profile-modal')">
    <span class="cm-icon">👤</span><span class="cm-text"><span class="cm-title">Мой профиль</span></span>
  </button>
  <button type="button" class="create-menu-btn" onclick="closeModal('create-menu-modal'); alert('Группы в разработке')">
    <span class="cm-icon">👥</span><span class="cm-text"><span class="cm-title">Создать группу</span></span>
  </button>
  <button type="button" class="modal-secondary" onclick="closeModal('create-menu-modal')">Отмена</button>
</div></div>

<div class="modal" id="profile-modal"><div class="modal-box">
  <h3>🎅 Мой профиль</h3>
  <div id="profile-banner-preview" class="profile-banner-preview" style="display:none;">
    <img id="profile-banner-img" src="" alt="">
    <button type="button" class="banner-remove-btn" onclick="alert('Убрать баннер')">×</button>
  </div>
  <div id="profile-username" style="text-align:center;color:var(--text-muted);margin-bottom:16px;font-size:14px"></div>
  <label>Имя</label><input id="my-first-name" placeholder="Имя" maxlength="40">
  <label>Фамилия</label><input id="my-last-name" placeholder="Фамилия" maxlength="40">
  <label>О себе</label><textarea id="my-bio" placeholder="Пара слов" maxlength="200" rows="3"></textarea>
  <button type="button" class="modal-primary" onclick="saveProfile()">💾 Сохранить</button>
  <button type="button" class="modal-primary" onclick="pickAvatarMedia()">📷 Сменить фото</button>
  <button type="button" class="modal-primary" onclick="pickBannerMedia()">🎨 Сменить баннер</button>
  <button type="button" class="modal-secondary" onclick="closeModal('profile-modal')">Закрыть</button>
</div></div>

<input type="file" id="photoFile" accept="image/*" style="display:none" onchange="sendPhoto(event)">

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
