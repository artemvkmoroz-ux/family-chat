<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Azerta</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1628">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="animations.css">
<style>
  /* Аварийные стили, чтобы ничего не обрезалось */
  * { box-sizing: border-box; }
  body { margin: 0; background: #0a1628; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
  
  #app { display: none; flex-direction: column; height: 100vh; height: 100dvh; }
  
  /* Шапка */
  .app-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: #0f1e35; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .app-header h1 { margin: 0; font-size: 20px; font-weight: 800; }
  .header-btns { display: flex; gap: 12px; align-items: center; }
  .header-btns button { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; padding: 0; }

  /* Список чатов */
  #chat-list { flex: 1; overflow-y: auto; padding: 10px; }
  .chat-item { display: flex; align-items: center; gap: 12px; padding: 12px; cursor: pointer; border-radius: 12px; transition: background 0.2s; }
  .chat-item:active { background: rgba(255,255,255,0.05); }
  .avatar { width: 50px; height: 50px; border-radius: 50%; background: #e63946; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; flex-shrink: 0; }
  .chat-info { flex: 1; overflow: hidden; }
  .chat-name { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-preview { font-size: 14px; color: #888; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Нижнее меню */
  #bottom-nav { display: flex; justify-content: space-around; align-items: center; padding: 8px 0 20px 0; background: #0f1e35; border-top: 1px solid rgba(255,255,255,0.05); flex-shrink: 0; }
  .nav-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; color: #888; cursor: pointer; padding: 5px 15px; transition: color 0.2s; }
  .nav-btn.active { color: #e63946; }
  .nav-icon { font-size: 24px; }
  .nav-label { font-size: 11px; font-weight: 600; }

  /* Экраны */
  #auth { display: none; position: fixed; inset: 0; background: #0a1628; z-index: 1000; align-items: center; justify-content: center; padding: 20px; flex-direction: column; }
  #chat-screen { display: none; position: fixed; inset: 0; background: #0a1628; z-index: 500; flex-direction: column; }
  #settings-screen { display: none; position: fixed; inset: 0; background: #0a1628; z-index: 800; flex-direction: column; }
  
  /* Чат */
  .chat-header { padding: 15px; background: #0f1e35; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .chat-header button { background: none; border: none; color: #e63946; font-size: 28px; cursor: pointer; }
  #messages { flex: 1; overflow-y: auto; padding: 15px; }
  .msg-wrap { display: flex; margin: 5px 0; }
  .msg-wrap.self { justify-content: flex-end; }
  .msg-wrap.other { justify-content: flex-start; }
  .msg { max-width: 75%; padding: 10px 15px; border-radius: 15px; font-size: 15px; word-break: break-word; }
  .msg.self { background: #e63946; color: #fff; }
  .msg.other { background: #1a3355; color: #fff; }
  .chat-input-area { padding: 10px; background: #0f1e35; display: flex; gap: 10px; border-top: 1px solid rgba(255,255,255,0.05); flex-shrink: 0; padding-bottom: 25px; }
  .chat-input-area input { flex: 1; padding: 12px; background: #142642; border: none; border-radius: 20px; color: #fff; font-size: 16px; }
  .chat-input-area button { width: 50px; height: 50px; border-radius: 50%; background: #e63946; border: none; color: #fff; font-size: 18px; cursor: pointer; }

  /* Заглушка */
  #splash-screen { position: fixed; inset: 0; background: #0a1628; display: flex; align-items: center; justify-content: center; z-index: 9999; font-size: 40px; font-weight: 800; letter-spacing: 4px; }
</style>
</head>
<body>

<div id="splash-screen">AZERTA</div>

<!-- ЭКРАН ВХОДА -->
<div id="auth">
  <div style="width: 100%; max-width: 400px;">
    <h1 style="text-align: center;">Вход</h1>
    <input id="login-username" placeholder="Ник" style="width: 100%; padding: 15px; margin-bottom: 10px; background: #142642; border: none; border-radius: 10px; color: #fff; font-size: 16px;">
    <input id="login-password" type="password" placeholder="Пароль" style="width: 100%; padding: 15px; margin-bottom: 20px; background: #142642; border: none; border-radius: 10px; color: #fff; font-size: 16px;">
    <button onclick="doLogin()" style="width: 100%; padding: 15px; background: #e63946; border: none; border-radius: 10px; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;">Войти</button>
  </div>
</div>

<!-- ОСНОВНОЕ ПРИЛОЖЕНИЕ -->
<div id="app">
  <!-- Шапка -->
  <div class="app-header">
    <h1>Azerta</h1>
    <div class="header-btns">
      <button onclick="openCreateMenu()">＋</button>
      <button onclick="openSettings()">👤</button>
    </div>
  </div>

  <!-- Список чатов -->
  <div id="chat-list"></div>

  <!-- Нижнее меню -->
  <div id="bottom-nav">
    <button class="nav-btn active" data-tab="chats" onclick="switchTab('chats')">
      <span class="nav-icon">💬</span><span class="nav-label">Чаты</span>
    </button>
    <button class="nav-btn" data-tab="calls" onclick="switchTab('calls')">
      <span class="nav-icon">📞</span><span class="nav-label">Звонки</span>
    </button>
    <button class="nav-btn" data-tab="contacts" onclick="switchTab('contacts')">
      <span class="nav-icon">👥</span><span class="nav-label">Контакты</span>
    </button>
    <button class="nav-btn" data-tab="settings" onclick="openSettings()">
      <span class="nav-icon">🎄</span><span class="nav-label">Настройки</span>
    </button>
  </div>
</div>

<!-- ЭКРАН ЧАТА -->
<div id="chat-screen">
  <div class="chat-header">
    <button onclick="closeChat()">‹</button>
    <div style="flex: 1;">
      <div id="chat-top-name" style="font-weight: 700; font-size: 16px;">—</div>
      <div id="chat-top-status" style="font-size: 12px; color: #888;">—</div>
    </div>
    <button onclick="startCall(false)" style="color: #fff;">📞</button>
    <button onclick="startCall(true)" style="color: #fff;">📹</button>
  </div>
  <div id="messages"></div>
  <div class="chat-input-area">
    <input id="msgInput" placeholder="Сообщение...">
    <button onclick="sendMsg()">➤</button>
  </div>
</div>

<!-- ЭКРАН НАСТРОЕК -->
<div id="settings-screen">
  <div class="chat-header">
    <button onclick="closeSettings()">‹</button>
    <h2 style="margin: 0; font-size: 18px;">Настройки</h2>
  </div>
  <div style="padding: 20px;">
    <button onclick="changeTheme()" style="width: 100%; padding: 15px; margin-bottom: 10px; background: #142642; border: none; border-radius: 10px; color: #fff; text-align: left; font-size: 16px; cursor: pointer;">🎨 Сменить тему</button>
    <button onclick="logout()" style="width: 100%; padding: 15px; margin-bottom: 10px; background: #142642; border: none; border-radius: 10px; color: #e63946; text-align: left; font-size: 16px; cursor: pointer;">🚪 Выйти</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
