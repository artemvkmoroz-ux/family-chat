<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Azerta</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1628">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="animations.css">
<style>
  /* Аварийные стили: гарантируют, что приложение покажется */
  body { margin: 0; background: #0a1628; color: #fff; overflow: hidden; }
  #splash-screen { position: fixed; inset: 0; background: #0a1628; display: flex; align-items: center; justify-content: center; z-index: 9999; font-size: 40px; font-weight: 800; letter-spacing: 4px; }
  #auth { display: none; position: fixed; inset: 0; z-index: 1000; background: #0a1628; align-items: center; justify-content: center; padding: 20px; flex-direction: column; }
  #app { display: none; flex-direction: column; height: 100vh; height: 100dvh; }
  #chat-list { flex: 1; overflow-y: auto; padding: 10px; }
  #bottom-nav { display: flex; justify-content: space-around; padding: 10px 0; background: #0f1e35; border-top: 1px solid rgba(255,255,255,0.1); }
  .chat-item { display: flex; align-items: center; gap: 12px; padding: 12px; cursor: pointer; border-radius: 12px; }
  .chat-item:hover { background: rgba(255,255,255,0.05); }
  .avatar { width: 50px; height: 50px; border-radius: 50%; background: #e63946; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; flex-shrink: 0; }
  .chat-name { font-weight: 600; font-size: 16px; }
  .chat-preview { font-size: 14px; color: #888; }
  #chat-screen { display: none; position: fixed; inset: 0; background: #0a1628; z-index: 500; flex-direction: column; }
  #messages { flex: 1; overflow-y: auto; padding: 15px; }
  .msg-wrap { display: flex; margin: 5px 0; }
  .msg-wrap.self { justify-content: flex-end; }
  .msg-wrap.other { justify-content: flex-start; }
  .msg { max-width: 75%; padding: 10px 15px; border-radius: 15px; font-size: 15px; }
  .msg.self { background: #e63946; }
  .msg.other { background: #1a3355; }
  #settings-screen { display: none; position: fixed; inset: 0; background: #0a1628; z-index: 800; flex-direction: column; }
  #call-screen { display: none; position: fixed; inset: 0; background: #000; z-index: 4000; flex-direction: column; }
  #incoming-screen { display: none; position: fixed; inset: 0; background: #0a1628; z-index: 4500; flex-direction: column; align-items: center; justify-content: space-around; }
  #modal-container { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
</style>
</head>
<body>

<div id="snow-layer" aria-hidden="true"></div>

<!-- ═══════════ ЗАСТАВКА ═══════════ -->
<div id="splash-screen">
  <div>AZERTA</div>
</div>

<!-- ═══════════ ЭКРАН ВХОДА ═══════════ -->
<div id="auth">
  <div style="width: 100%; max-width: 400px;">
    <div style="text-align: center; margin-bottom: 30px;">
      <div style="font-size: 60px;">🎄</div>
      <h1 style="margin: 10px 0;">Azerta</h1>
      <p style="color: #888;">Семейный мессенджер</p>
    </div>
    <input id="login-username" placeholder="Ник" style="width: 100%; padding: 15px; margin-bottom: 10px; background: #142642; border: none; border-radius: 10px; color: #fff; font-size: 16px; box-sizing: border-box;">
    <input id="login-password" type="password" placeholder="Пароль" style="width: 100%; padding: 15px; margin-bottom: 20px; background: #142642; border: none; border-radius: 10px; color: #fff; font-size: 16px; box-sizing: border-box;">
    <button onclick="doLogin()" style="width: 100%; padding: 15px; background: #e63946; border: none; border-radius: 10px; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;">Войти</button>
  </div>
</div>

<!-- ═══════════ ОСНОВНОЕ ПРИЛОЖЕНИЕ ═══════════ -->
<div id="app">
  <!-- Шапка -->
  <div style="padding: 15px; background: #0f1e35; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.1);">
    <button onclick="openSettings()" style="background: none; border: none; color: #fff; font-size: 24px; cursor: pointer;">☰</button>
    <h2 style="margin: 0; flex: 1;">Azerta</h2>
    <button onclick="alert('Создание')" style="background: none; border: none; color: #fff; font-size: 24px; cursor: pointer;">＋</button>
    <button onclick="openSettings()" style="background: none; border: none; color: #fff; font-size: 20px; cursor: pointer;">👤</button>
  </div>
  
  <!-- Список чатов -->
  <div id="chat-list"></div>
  
  <!-- Нижнее меню -->
  <div id="bottom-nav">
    <button onclick="switchTab('chats')" style="background: none; border: none; color: #e63946; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer;">
      <span style="font-size: 24px;">💬</span><span style="font-size: 12px;">Чаты</span>
    </button>
    <button onclick="switchTab('calls')" style="background: none; border: none; color: #888; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer;">
      <span style="font-size: 24px;">📞</span><span style="font-size: 12px;">Звонки</span>
    </button>
    <button onclick="switchTab('contacts')" style="background: none; border: none; color: #888; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer;">
      <span style="font-size: 24px;">👥</span><span style="font-size: 12px;">Контакты</span>
    </button>
    <button onclick="openSettings()" style="background: none; border: none; color: #888; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer;">
      <span style="font-size: 24px;">🎄</span><span style="font-size: 12px;">Настройки</span>
    </button>
  </div>
</div>

<!-- ═══════════ ЭКРАН ЧАТА ═══════════ -->
<div id="chat-screen">
  <div style="padding: 15px; background: #0f1e35; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.1);">
    <button onclick="closeChat()" style="background: none; border: none; color: #e63946; font-size: 28px; cursor: pointer;">‹</button>
    <div class="avatar" id="chat-avatar" style="width: 40px; height: 40px; font-size: 16px;">?</div>
    <div style="flex: 1;">
      <div id="chat-top-name" style="font-weight: 700; font-size: 16px;">—</div>
      <div id="chat-top-status" style="font-size: 12px; color: #888;">—</div>
    </div>
    <button onclick="startCall(false)" style="background: none; border: none; color: #fff; font-size: 20px; cursor: pointer;">📞</button>
    <button onclick="startCall(true)" style="background: none; border: none; color: #fff; font-size: 20px; cursor: pointer;">📹</button>
  </div>
  
  <div id="messages"></div>
  
  <div style="padding: 10px; background: #0f1e35; display: flex; gap: 10px; border-top: 1px solid rgba(255,255,255,0.1);">
    <button onclick="toggleStickersPanel()" style="background: none; border: none; color: #fff; font-size: 24px; cursor: pointer;">😀</button>
    <input id="msgInput" placeholder="Сообщение..." style="flex: 1; padding: 12px; background: #142642; border: none; border-radius: 20px; color: #fff; font-size: 16px; box-sizing: border-box;">
    <button onclick="sendMsg()" style="width: 50px; height: 50px; background: #e63946; border: none; border-radius: 50%; color: #fff; font-size: 18px; cursor: pointer;">➤</button>
  </div>
</div>

<!-- ═══════════ ЭКРАН НАСТРОЕК ═══════════ -->
<div id="settings-screen">
  <div style="padding: 15px; background: #0f1e35; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.1);">
    <button onclick="closeSettings()" style="background: none; border: none; color: #e63946; font-size: 28px; cursor: pointer;">‹</button>
    <h2 style="margin: 0;">Настройки</h2>
  </div>
  <div style="padding: 20px;">
    <div class="chat-item" onclick="openProfile()"><div class="avatar">👤</div><div class="chat-info"><div class="chat-name">Мой профиль</div></div></div>
    <div class="chat-item" onclick="changeTheme()"><div class="avatar">🎨</div><div class="chat-info"><div class="chat-name">Сменить тему</div></div></div>
    <div class="chat-item" onclick="logout()"><div class="avatar" style="background: #c1121f;">🚪</div><div class="chat-info"><div class="chat-name" style="color: #e63946;">Выйти</div></div></div>
  </div>
</div>

<!-- ═══════════ ЭКРАН ЗВОНКА ═══════════ -->
<div id="call-screen">
  <div style="flex: 1; display: flex; align-items: center; justify-content: center;">
    <video id="remoteVideo" autoplay playsinline style="width: 100%; height: 100%; object-fit: cover;"></video>
    <video id="localVideo" autoplay muted playsinline style="position: absolute; top: 100px; right: 20px; width: 100px; height: 150px; border-radius: 10px; object-fit: cover; border: 2px solid #e63946;"></video>
  </div>
  <div style="padding: 20px; text-align: center; background: #0a1628;">
    <div id="call-peer-name" style="font-size: 24px; font-weight: 700; margin-bottom: 10px;">—</div>
    <div id="call-status" style="color: #888; margin-bottom: 20px;">Соединение...</div>
    <div id="call-timer" style="font-size: 20px; font-weight: 700; margin-bottom: 20px;">0:00</div>
    <div style="display: flex; justify-content: center; gap: 20px;">
      <button id="micBtn" onclick="toggleMic()" style="width: 60px; height: 60px; border-radius: 50%; background: #142642; border: none; color: #fff; font-size: 24px; cursor: pointer;">🎤</button>
      <button id="camBtn" onclick="toggleCamera()" style="width: 60px; height: 60px; border-radius: 50%; background: #142642; border: none; color: #fff; font-size: 24px; cursor: pointer;">📷</button>
      <button onclick="hangup()" style="width: 60px; height: 60px; border-radius: 50%; background: #e63946; border: none; color: #fff; font-size: 24px; cursor: pointer;">📵</button>
    </div>
  </div>
</div>

<!-- ═══════════ ВХОДЯЩИЙ ЗВОНОК ═══════════ -->
<div id="incoming-screen">
  <div style="text-align: center;">
    <div style="font-size: 14px; color: #888; margin-bottom: 10px;">Входящий звонок</div>
    <div id="incoming-name" style="font-size: 28px; font-weight: 700;">—</div>
    <div id="incoming-type" style="color: #888; margin-top: 10px;">Видеозвонок</div>
  </div>
  <div style="display: flex; gap: 40px;">
    <button onclick="declineIncoming()" style="width: 70px; height: 70px; border-radius: 50%; background: #e63946; border: none; color: #fff; font-size: 28px; cursor: pointer;">📵</button>
    <button onclick="acceptIncoming()" style="width: 70px; height: 70px; border-radius: 50%; background: #22c55e; border: none; color: #fff; font-size: 28px; cursor: pointer;">📞</button>
  </div>
</div>

<!-- ═══════════ УНИВЕРСАЛЬНОЕ МОДАЛЬНОЕ ОКНО ═══════════ -->
<div id="modal-container" onclick="if(event.target===this) closeAllModals()">
  <div id="modal-box" style="background: #142642; border-radius: 20px; padding: 20px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto;">
    <h2 id="modal-title" style="margin-top: 0; margin-bottom: 20px; text-align: center;">Заголовок</h2>
    <div id="modal-content"></div>
    <button onclick="closeAllModals()" style="width: 100%; padding: 12px; margin-top: 15px; background: #0f1e35; border: none; border-radius: 10px; color: #fff; cursor: pointer;">Закрыть</button>
  </div>
</div>

<!-- Скрытые инпуты для загрузки файлов -->
<input type="file" id="photoFile" accept="image/*" style="display: none;" onchange="sendPhoto(event)">
<input type="file" id="avatarFile" accept="image/*" style="display: none;" onchange="uploadAvatar(event)">

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
