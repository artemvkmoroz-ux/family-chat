<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aurora</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

  /* ===== АВТОРИЗАЦИЯ ===== */
  #auth { position: fixed; inset: 0; background: #0a0a0a; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; z-index: 1000; }
  #auth .logo { font-size: 48px; margin-bottom: 8px; }
  #auth h1 { font-size: 32px; margin-bottom: 4px; background: linear-gradient(90deg, #0a84ff, #5f27cd, #ff9ff3); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 800; letter-spacing: 1px; }
  #auth .subtitle { color: #888; margin-bottom: 30px; font-size: 14px; }
  #auth input { width: 100%; max-width: 320px; padding: 14px 16px; font-size: 16px; background: #1c1c1e; border: 1px solid #2c2c2e; border-radius: 12px; color: #fff; margin-bottom: 12px; outline: none; }
  #auth input:focus { border-color: #0a84ff; }
  #auth button { width: 100%; max-width: 320px; padding: 14px; font-size: 16px; font-weight: 600; background: #0a84ff; border: none; border-radius: 12px; color: #fff; cursor: pointer; margin-bottom: 10px; }
  #auth .switch { color: #0a84ff; background: none; border: none; font-size: 14px; cursor: pointer; padding: 8px; }
  #auth .error { color: #ff3b30; font-size: 13px; margin-bottom: 10px; text-align: center; min-height: 18px; }
  #auth .hint { color: #666; font-size: 12px; margin-top: 6px; text-align: center; max-width: 320px; }

  /* ===== ШАПКА ===== */
  #notif-banner { position: fixed; top: 0; left: 0; right: 0; background: #0a84ff; color: #fff; padding: 12px 16px; display: none; align-items: center; justify-content: space-between; z-index: 3000; font-size: 14px; }
  #notif-banner.active { display: flex; }
  #notif-banner button { background: rgba(255,255,255,0.25); border: none; color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; font-weight: 600; }

  #app { display: none; flex-direction: column; height: 100vh; }
  #app.active { display: flex; }
  #header { padding: 14px 16px 10px; display: flex; align-items: center; justify-content: space-between; }
  #header h2 { font-size: 22px; font-weight: 700; background: linear-gradient(90deg, #0a84ff, #5f27cd); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .header-actions { display: flex; gap: 8px; }
  .icon-btn { width: 36px; height: 36px; border-radius: 50%; background: #1c1c1e; border: none; color: #0a84ff; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 0; }
  .icon-btn img { width: 100%; height: 100%; object-fit: cover; }

  /* ===== СПИСОК КОНТАКТОВ ===== */
  #chat-list { flex: 1; overflow-y: auto; padding: 0 8px; }
  .chat-item { display: flex; align-items: center; gap: 12px; padding: 12px 8px; border-radius: 12px; cursor: pointer; }
  .chat-item:hover, .chat-item.active { background: #1c1c1e; }
  .chat-item.unread .chat-name { font-weight: 700; }
  .avatar { width: 52px; height: 52px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 18px; color: #fff; background-size: cover; background-position: center; position: relative; }
  .avatar .online-dot { position: absolute; bottom: 2px; right: 2px; width: 12px; height: 12px; border-radius: 50%; background: #4caf50; border: 2px solid #0a0a0a; }
  .chat-info { flex: 1; min-width: 0; }
  .chat-name { font-size: 16px; font-weight: 600; margin-bottom: 3px; }
  .chat-preview { font-size: 14px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-meta { text-align: right; flex-shrink: 0; }
  .chat-badge { display: inline-block; min-width: 22px; height: 22px; line-height: 22px; padding: 0 7px; background: #ff3b30; color: #fff; border-radius: 11px; font-size: 12px; font-weight: 700; text-align: center; }

  .empty-state { text-align: center; color: #666; padding: 60px 20px; font-size: 14px; line-height: 1.6; }
  .empty-state .big { font-size: 40px; margin-bottom: 12px; }

  #tabbar { display: flex; justify-content: space-around; padding: 10px 0 20px; border-top: 1px solid #1c1c1e; }
  .tab { flex: 1; text-align: center; color: #666; font-size: 11px; cursor: pointer; padding: 4px; }
  .tab.active { color: #0a84ff; }
  .tab .tab-icon { font-size: 22px; display: block; margin-bottom: 2px; }

  /* ===== ЧАТ ===== */
  #chat-screen { position: fixed; inset: 0; background: #0a0a0a; display: none; flex-direction: column; z-index: 500; }
  #chat-screen.active { display: flex; }
  #chat-top { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid #1c1c1e; }
  .back-btn { background: none; border: none; color: #0a84ff; font-size: 22px; cursor: pointer; padding: 4px 8px; }
  #chat-top .avatar { width: 38px; height: 38px; font-size: 14px; }
  #chat-top-name { font-weight: 600; font-size: 16px; }
  #chat-top-status { font-size: 12px; color: #888; margin-top: 2px; }
  #call-actions { display: flex; gap: 8px; margin-left: auto; }
  #call-actions button { background: none; border: none; color: #0a84ff; font-size: 22px; cursor: pointer; padding: 4px; }

  #messages { flex: 1; overflow-y: auto; padding: 12px 14px; }
  .msg { max-width: 75%; padding: 9px 13px; margin: 3px 0; border-radius: 18px; font-size: 15px; word-wrap: break-word; clear: both; }
  .msg.self { background: #0a84ff; float: right; border-bottom-right-radius: 5px; }
  .msg.other { background: #1c1c1e; float: left; border-bottom-left-radius: 5px; }
  .msg .time { font-size: 10px; opacity: 0.6; margin-left: 6px; }
  .msg img.photo { max-width: 100%; border-radius: 12px; display: block; margin-bottom: 4px; cursor: pointer; }

  #input-area { display: flex; align-items: center; gap: 8px; padding: 10px 12px 24px; border-top: 1px solid #1c1c1e; }
  #input-area input:not([type="file"]) { flex: 1; padding: 11px 16px; background: #1c1c1e; border: none; border-radius: 22px; color: #fff; font-size: 15px; outline: none; }
  #input-area button { width: 42px; height: 42px; border-radius: 50%; background: #0a84ff; border: none; color: #fff; font-size: 18px; cursor: pointer; flex-shrink: 0; }
  #input-area button.attach-btn { background: #1c1c1e; color: #0a84ff; font-size: 20px; }

  /* ===== ВИДЕО ===== */
  #video-area { position: fixed; top: 10px; right: 10px; display: none; flex-direction: column; gap: 10px; z-index: 1000; background: rgba(0,0,0,0.85); padding: 10px; border-radius: 16px; }
  #video-area.active { display: flex; }
  video { width: 150px; background: #000; border-radius: 12px; }
  #call-controls { display: flex; gap: 6px; justify-content: center; }
  #call-controls button { padding: 8px 10px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; background: #2c2c2e; color: #fff; }
  #call-controls button.off { background: #ff3b30; }

  /* ===== МОДАЛКИ ===== */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
  .modal.active { display: flex; }
  .modal-box { background: #1c1c1e; border-radius: 16px; padding: 20px; max-width: 340px; width: 100%; }
  .modal-box h3 { margin-bottom: 16px; font-size: 18px; text-align: center; }
  .modal-box input { width: 100%; padding: 12px 14px; font-size: 15px; background: #0a0a0a; border: 1px solid #2c2c2e; border-radius: 10px; color: #fff; margin-bottom: 10px; outline: none; }
  .modal-box input:focus { border-color: #0a84ff; }
  .modal-box button { width: 100%; padding: 12px; margin-bottom: 8px; border: none; border-radius: 10px; font-size: 15px; cursor: pointer; }
  .modal-primary { background: #0a84ff; color: #fff; font-weight: 600; }
  .modal-secondary { background: #2c2c2e; color: #fff; }
  .modal-danger { background: #ff3b30; color: #fff; }
  .modal-error { color: #ff3b30; font-size: 13px; margin-bottom: 10px; text-align: center; min-height: 16px; }

  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 3000; padding: 20px; }
  #lightbox.active { display: flex; }
  #lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }

  @media (max-width: 600px) { video { width: 90px; } }
</style>
</head>
<body>

<div id="notif-banner">
  <span>🔔 Включить уведомления?</span>
  <button onclick="enableNotifications()">Включить</button>
</div>

<!-- ЭКРАН АВТОРИЗАЦИИ -->
<div id="auth">
  <div class="logo">🌌</div>
  <h1>Aurora</h1>
  <div class="subtitle">Твой семейный мессенджер</div>

  <input id="auth-username" placeholder="Ник (латиница)" autocapitalize="none" autocomplete="username" />
  <input id="auth-password" type="password" placeholder="Пароль" autocomplete="current-password" />
  <input id="auth-password2" type="password" placeholder="Повтори пароль" autocomplete="new-password" style="display:none" />

  <div class="error" id="auth-error"></div>

  <button id="auth-btn" onclick="doAuth()">Войти</button>
  <button class="switch" id="auth-switch" onclick="toggleAuthMode()">Нет аккаунта? Зарегистрироваться</button>

  <div class="hint" id="auth-hint">Ник — только латиница, цифры и _</div>
</div>

<!-- МОДАЛКА ПРОФИЛЯ -->
<div class="modal" id="profile-modal">
  <div class="modal-box">
    <h3>Мой профиль</h3>
    <div id="profile-username" style="text-align:center; color:#888; margin-bottom:16px; font-size:14px"></div>
    <button class="modal-primary" onclick="document.getElementById('avatarFile').click()">📷 Сменить фото</button>
    <button class="modal-secondary" onclick="closeModal('profile-modal')">Закрыть</button>
    <button class="modal-danger" onclick="logout()">🚪 Выйти из аккаунта</button>
  </div>
</div>

<!-- МОДАЛКА ДОБАВЛЕНИЯ КОНТАКТА -->
<div class="modal" id="add-modal">
  <div class="modal-box">
    <h3>Добавить контакт</h3>
    <input id="add-username" placeholder="Ник друга" autocapitalize="none" autocomplete="off" onkeydown="if(event.key==='Enter')doAddContact()" />
    <div class="modal-error" id="add-error"></div>
    <button class="modal-primary" onclick="doAddContact()">Добавить</button>
    <button class="modal-secondary" onclick="closeModal('add-modal')">Отмена</button>
  </div>
</div>

<!-- ГЛАВНЫЙ ЭКРАН -->
<div id="app">
  <div id="header">
    <h2>Aurora</h2>
    <div class="header-actions">
      <button class="icon-btn" onclick="openModal('add-modal')" title="Добавить контакт">＋</button>
      <button class="icon-btn" id="my-avatar-btn" onclick="openProfile()"></button>
    </div>
  </div>

  <div id="chat-list"></div>

  <div id="tabbar">
    <div class="tab active"><span class="tab-icon">💬</span>Чаты</div>
    <div class="tab" onclick="openModal('add-modal')"><span class="tab-icon">👥</span>Добавить</div>
    <div class="tab" onclick="openProfile()"><span class="tab-icon">⚙️</span>Профиль</div>
  </div>
</div>

<!-- ЭКРАН ЧАТА -->
<div id="chat-screen">
  <div id="chat-top">
    <button class="back-btn" onclick="closeChat()">‹</button>
    <div class="avatar" id="chat-avatar"></div>
    <div>
      <div id="chat-top-name">—</div>
      <div id="chat-top-status">—</div>
    </div>
    <div id="call-actions">
      <button onclick="startCall(false)">📞</button>
      <button onclick="startCall(true)">📹</button>
    </div>
  </div>
  <div id="messages"></div>
  <div id="input-area">
    <button class="attach-btn" onclick="document.getElementById('photoFile').click()">📎</button>
    <input type="file" id="photoFile" accept="image/*" style="display:none" onchange="sendPhoto(event)" />
    <input id="msgInput" placeholder="Сообщение..." onkeydown="if(event.key==='Enter')sendMsg()" />
    <button onclick="sendMsg()">➤</button>
  </div>
</div>

<!-- ВИДЕО -->
<div id="video-area">
  <video id="localVideo" autoplay muted playsinline></video>
  <video id="remoteVideo" autoplay playsinline></video>
  <div id="call-controls">
    <button id="micBtn" onclick="toggleMic()">🎤</button>
    <button id="camBtn" onclick="toggleCam()">📷</button>
    <button onclick="hangUp()" style="background:#ff3b30;">📵</button>
  </div>
</div>

<!-- СКРЫТЫЕ ИНПУТЫ -->
<input type="file" id="avatarFile" accept="image/*" style="display:none" onchange="uploadAvatar(event)" />

<div id="lightbox" onclick="this.classList.remove('active')">
  <img id="lightbox-img" src="" alt="">
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let myName = null;
let myAvatar = null;
let currentChat = null;
let contacts = [];
let unread = {};
let authMode = 'login'; // 'login' | 'register'

const PROFILE_KEY = 'aurora-profile';
const UNREAD_KEY = 'aurora-unread';

// ============ АВТОРИЗАЦИЯ ============
function toggleAuthMode() {
  authMode = authMode === 'login' ? 'register' : 'login';
  document.getElementById('auth-password2').style.display = authMode === 'register' ? 'block' : 'none';
  document.getElementById('auth-btn').textContent = authMode === 'login' ? 'Войти' : 'Зарегистрироваться';
  document.getElementById('auth-switch').textContent = authMode === 'login'
    ? 'Нет аккаунта? Зарегистрироваться'
    : 'Уже есть аккаунт? Войти';
  document.getElementById('auth-hint').textContent = authMode === 'register'
    ? 'Ник — только латиница, цифры и _. Пароль — минимум 4 символа'
    : '';
  document.getElementById('auth-error').textContent = '';
}

function doAuth() {
  const username = document.getElementById('auth-username').value.trim().toLowerCase();
  const password = document.getElementById('auth-password').value;
  const errEl = document.getElementById('auth-error');
  errEl.textContent = '';

  if (!username || !password) return errEl.textContent = 'Заполни все поля';

  if (authMode === 'register') {
    const password2 = document.getElementById('auth-password2').value;
    if (password !== password2) return errEl.textContent = 'Пароли не совпадают';

    socket.emit('register', { username, password }, (res) => {
      if (!res.ok) return errEl.textContent = res.error;
      // После регистрации автоматически входим
      socket.emit('login', { username, password }, (r2) => {
        if (r2.ok) onLoggedIn(r2.username, r2.avatar);
        else errEl.textContent = r2.error || 'Ошибка входа';
      });
    });
  } else {
    socket.emit('login', { username, password }, (res) => {
      if (!res.ok) return errEl.textContent = res.error;
      onLoggedIn(res.username, res.avatar);
    });
  }
}

function onLoggedIn(username, avatar) {
  myName = username;
  myAvatar = avatar || null;
  saveProfile();
  document.getElementById('auth').style.display = 'none';
  document.getElementById('app').classList.add('active');
  updateMyAvatarBtn();
}

function logout() {
  if (!confirm('Выйти из аккаунта?')) return;
  try { localStorage.removeItem(PROFILE_KEY); localStorage.removeItem(UNREAD_KEY); } catch (e) {}
  location.reload();
}

function saveProfile() {
  try { localStorage.setItem(PROFILE_KEY, JSON.stringify({ username: myName })); } catch (e) {}
}

// Автовход: если мы уже входили — пытаемся войти снова (пароль не помним, но сессия на сервере)
// Для простоты: показываем экран входа всегда. Автовход требует хранения пароля — небезопасно.
// Если хочешь автовход — храни пароль локально (не рекомендую).

// ============ УВЕДОМЛЕНИЯ ============
let notificationsAllowed = false;
function initNotifications() {
  if (!('Notification' in window)) return;
  if (Notification.permission === 'granted') notificationsAllowed = true;
  else if (Notification.permission === 'default') {
    const b = document.getElementById('notif-banner');
    if (b) b.classList.add('active');
  }
}
async function enableNotifications() {
  document.getElementById('notif-banner').classList.remove('active');
  if (!('Notification' in window)) return alert('Браузер не поддерживает уведомления');
  try {
    const perm = await Notification.requestPermission();
    if (perm === 'granted') {
      notificationsAllowed = true;
      new Notification('Aurora', { body: 'Уведомления включены! 🎉' });
    }
  } catch (e) {}
}
function playPing() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.3);
  } catch (e) {}
}
function vibrate() { if ('vibrate' in navigator) { try { navigator.vibrate([100, 50, 100]); } catch (e) {} } }
function showBrowserNotification(from, text) {
  if (!notificationsAllowed) return;
  if (document.visibilityState === 'visible' && currentChat === from) return;
  try {
    const n
